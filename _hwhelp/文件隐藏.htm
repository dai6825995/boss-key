</HEAD><P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt"><B><SPAN STYLE="font-family: 宋体; color: navy">【文件及文件夹隐藏功能设置】</SPAN></B></P><P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt">
&nbsp;</P>
<p CLASS="MsoNormal" ALIGN="left" STYLE="layout-grid-mode: char; margin-top: 4.65pt">
此功能已经独立为一个“私人文件夹”程序，可以锁定并隐藏指定的文件夹。被隐藏的文件夹在资源管理器中将无法看到，而且即使通过历史记录等快捷方式也无法打开锁定的文件。</p>
<p CLASS="MsoNormal" ALIGN="left" STYLE="layout-grid-mode: char; margin-top: 4.65pt">
&nbsp;</p>
<p CLASS="MsoNormal" ALIGN="left" STYLE="layout-grid-mode: char; margin-top: 4.65pt">
使用此功能时，请在屏幕右下角的系统通知区用鼠标右键点击本程序图标，选择“私人文件夹”即可打开这个独立程序。 
在程序列表中双击即可打开被锁定的文件夹，当关闭文件夹时，自动恢复至锁定及隐藏状态。</p>
