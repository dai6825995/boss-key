</HEAD><P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt"><B><SPAN STYLE="font-family: 宋体; color: navy">【进程隐藏设置】</SPAN></B></P><P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt">
进程隐藏成功后，用户在任务管理器中将看不到被隐藏的进程。</P>
<P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt">　</P>
<P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt">
特别说明：</P>
<P CLASS="MsoNormal" ALIGN="left" STYLE="text-align: left; layout-grid-mode: char; margin-top: 4.65pt">
1、如需同时隐藏多个进程，请在设置时将进程名称用半角逗号分开，逗号两边不能有空格。 <BR>
2、进程隐藏仅在无忧隐藏运行期间有效，当无忧隐藏退出时，进程隐藏功能自动失效。 <BR>
3、此功能可能被某些安全软件拦截。例如卡巴斯基用户若使用此功能就需要关闭主动防御功能中的“检测隐藏对象”功能，否则将导致隐藏的进程被终止。<BR>
4、进程隐藏功能不支持64位操作系统。 </P>
